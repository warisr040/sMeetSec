<script>try{document.documentElement.dataset.theme=localStorage.getItem("smeetsec.theme")||"simple"}catch(e){}</script>
<style>
/* =================== themes (same family as sGenko / sUML / sERP) =================== */
:root,[data-theme=simple]{
  --bg:#e9ebf0;--panel:#ffffff;--panel2:#f4f5f8;--line:#e3e6ec;--ink:#1d2330;--muted:#6b7380;
  --brand:#4f46e5;--bad:#e03131;--ok:#2f9e44;--warn:#d97706;--brand2:rgba(79,70,229,.11);--on-brand:#ffffff;
  --tex:none;--glass:rgba(255,255,255,.94);--shadow:0 16px 50px rgba(30,27,75,.18);color-scheme:light;
}
[data-theme=dark]{
  --bg:#15171b;--panel:#23272e;--panel2:#2b3038;--line:#363c46;--ink:#e6e8eb;--muted:#9aa3ae;
  --brand:#4dabf7;--bad:#ff6b6b;--ok:#51cf66;--warn:#fcc419;--brand2:#1f4a6b;--on-brand:#081521;
  --tex:none;--glass:rgba(35,39,46,.95);--shadow:0 16px 50px rgba(0,0,0,.6);color-scheme:dark;
}
[data-theme=starry]{
  --bg:#0a1530;--panel:#0c1a3d;--panel2:#11234d;--line:rgba(160,190,255,.2);--ink:#e8ecff;--muted:#9fb0d6;
  --brand:#8cc8ff;--bad:#fca5a5;--ok:#7dd3fc;--warn:#fcd34d;--brand2:rgba(140,200,255,.18);--on-brand:#0a1530;
  --glass:rgba(12,26,61,.95);
  --tex:radial-gradient(1.3px 1.3px at 20% 30%,rgba(255,255,255,.55) 60%,transparent 100%) 0 0/83px 79px,radial-gradient(1.1px 1.1px at 65% 70%,rgba(200,225,255,.45) 60%,transparent 100%) 0 0/127px 109px,radial-gradient(1px 1px at 40% 55%,rgba(200,215,255,.42) 60%,transparent 100%) 0 0/61px 67px;
  --shadow:0 16px 50px rgba(0,0,0,.6);color-scheme:dark;
}
[data-theme=forest]{
  --bg:#e3ebdc;--panel:#f8f5ec;--panel2:#efeadc;--line:rgba(47,90,54,.18);--ink:#1f3324;--muted:#5f7363;
  --brand:#2f6b3a;--bad:#b4413a;--ok:#2f6b3a;--warn:#b7791f;--brand2:rgba(47,107,58,.12);--on-brand:#ffffff;
  --glass:rgba(248,245,236,.96);
  --tex:radial-gradient(ellipse 50% 40% at 95% 100%,rgba(47,107,58,.16),transparent 70%);
  --shadow:0 16px 50px rgba(31,51,36,.2);color-scheme:light;
}
[data-theme=burning]{
  --bg:#150e0b;--panel:#1c120e;--panel2:#261813;--line:rgba(255,140,80,.18);--ink:#f7e9df;--muted:#c4a796;
  --brand:#ff7a33;--bad:#fb7185;--ok:#fbbf24;--warn:#fbbf24;--brand2:rgba(255,122,51,.18);--on-brand:#1c120e;
  --glass:rgba(28,18,14,.95);
  --tex:radial-gradient(ellipse 70% 45% at 50% 115%,rgba(255,106,0,.22),transparent 60%);
  --shadow:0 16px 50px rgba(0,0,0,.65);color-scheme:dark;
}
[data-theme=sakura]{
  --bg:#f7e3ea;--panel:#fff6f9;--panel2:#fdebf1;--line:#f3d3df;--ink:#4a2a36;--muted:#9a6b7c;
  --brand:#e75a8c;--bad:#c92a5b;--ok:#5aa469;--warn:#c47f17;--brand2:rgba(231,90,140,.14);--on-brand:#ffffff;
  --glass:rgba(255,246,249,.96);
  --tex:radial-gradient(ellipse 7px 4px at 30% 40%,rgba(240,140,170,.35) 60%,transparent 100%) 0 0/140px 120px,radial-gradient(ellipse 5px 3px at 70% 75%,rgba(250,170,195,.4) 60%,transparent 100%) 0 0/190px 160px,radial-gradient(ellipse 4px 6px at 15% 80%,rgba(240,150,180,.28) 60%,transparent 100%) 0 0/110px 150px;
  --shadow:0 16px 50px rgba(120,40,70,.18);color-scheme:light;
}
[data-theme=snowy]{
  --bg:#e6eef6;--panel:#fbfdff;--panel2:#eef4fa;--line:#d6e2ee;--ink:#1e2f40;--muted:#6a8096;
  --brand:#3b8fd6;--bad:#e05a6d;--ok:#2f9e8f;--warn:#c98a1a;--brand2:rgba(59,143,214,.13);--on-brand:#ffffff;
  --glass:rgba(251,253,255,.96);
  --tex:radial-gradient(2px 2px at 25% 35%,rgba(255,255,255,.95) 60%,transparent 100%) 0 0/70px 66px,radial-gradient(1.5px 1.5px at 60% 70%,rgba(255,255,255,.9) 60%,transparent 100%) 0 0/43px 51px,radial-gradient(3px 3px at 80% 20%,rgba(255,255,255,.8) 60%,transparent 100%) 0 0/131px 117px;
  --shadow:0 16px 50px rgba(30,60,100,.18);color-scheme:light;
}
:root{--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI','Leelawadee UI','Yu Gothic UI','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 14px;color:var(--ink)}
button:hover{border-color:var(--brand)}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel);color:var(--ink)}
input[type=range],input[type=checkbox]{accent-color:var(--brand)}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px}
.logo b{font-size:18px;letter-spacing:.2px}
.logo small{color:var(--muted);display:block;font-size:11px;margin-top:-2px}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:var(--panel2);font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#aab}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.cpubar{width:60px;height:6px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.cpubar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);transition:width .5s}
.cpubar .lim{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.wrap{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 57px)}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside .new{padding:14px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
aside .list{overflow:auto;flex:1;padding:6px}
.mitem{padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.mitem:hover{background:var(--panel2)}
.mitem.on{background:var(--brand2)}
.mitem .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px}
.badge{white-space:nowrap;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--panel2);color:var(--muted)}
.badge.done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.badge.run{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.badge.err,.badge.live{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
main{overflow:auto;padding:22px 28px;min-height:0;background:var(--tex),var(--bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.drop{border:2px dashed color-mix(in srgb,var(--muted) 45%,transparent);border-radius:var(--r);padding:34px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop.hover{border-color:var(--brand);background:var(--brand2);color:var(--brand)}
.drop b{color:var(--ink)}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.job{margin-top:10px}
.job .bar{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
.job .bar i{display:block;height:100%;background:var(--brand);transition:width .4s}
.job .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--muted)}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.pills{display:flex;gap:6px;margin-bottom:12px}
.pills button{border-radius:20px;padding:4px 14px;font-size:13px}
.pills button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
table.tr{width:100%;border-collapse:collapse}
table.tr td{border-bottom:1px solid var(--line);padding:6px 6px;vertical-align:top}
table.tr td.time{color:var(--muted);font-size:12px;width:62px;white-space:nowrap;padding-top:9px}
table.tr td.spk{width:120px}
table.tr td.spk input{width:110px;padding:4px 6px;font-size:12px}
table.tr td.txt div{padding:3px 6px;border-radius:6px;outline:none;line-height:1.55}
table.tr td.txt div:focus{background:var(--brand2)}
table.tr td.tl{color:var(--ink);line-height:1.55;padding-top:9px}
:lang(zh-Hans){font-family:'Segoe UI','Microsoft YaHei',sans-serif}:lang(zh-Hant){font-family:'Segoe UI','Microsoft JhengHei',sans-serif}
.rep h3{font-size:14px;margin:18px 0 6px;color:var(--brand)}
.rep ul{margin:0;padding-left:20px;line-height:1.6}
.rep table{border-collapse:collapse;width:100%}
.rep td,.rep th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.rep th{background:var(--panel2)}
.files a{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:8px;margin:0 6px 6px 0;color:var(--ink);text-decoration:none;font-size:13px}
.files a:hover{border-color:var(--brand);color:var(--brand)}
.live-box{min-height:280px;max-height:52vh;overflow:auto;background:var(--panel2);border-radius:10px;padding:14px;line-height:1.7}
.live-box .seg{margin-bottom:6px}
.live-box .seg span{color:var(--muted);font-size:12px;margin-right:8px}
.live-box .partial{color:var(--muted);font-style:italic}
.meter{width:120px;height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0}
.rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.note{background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.note.err{background:color-mix(in srgb,var(--bad) 11%,var(--panel));border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.note.info{background:var(--brand2);border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
.modal{position:fixed;inset:0;background:rgba(20,28,45,.35);display:none;align-items:center;justify-content:center;z-index:20}
.modal.on{display:flex}
.modal .box{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);border-radius:16px;width:min(760px,94vw);max-height:90vh;overflow:auto;padding:22px 24px}
.modal h3{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.pop{position:fixed;z-index:40;top:58px;right:14px;width:380px;padding:14px 16px;border-radius:14px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);max-height:calc(100vh - 80px);overflow:auto}
.pop[hidden]{display:none}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.phead b{font-size:15px}
.xbtn{border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px;width:28px;height:28px;font-size:17px;line-height:1;padding:0}
.xbtn:hover{background:var(--panel2);color:var(--ink)}
.pnote{font-size:11.5px;color:var(--muted);margin:4px 0 8px}
.thgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.thcard{border:1.5px solid var(--line);border-radius:13px;padding:7px;background:none;cursor:pointer;text-align:left;color:var(--ink)}
.thcard:hover{border-color:var(--brand)}
.thcard.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand2)}
.thcard .prev{height:56px;border-radius:9px;position:relative;overflow:hidden;margin-bottom:7px}
.thcard .prev i{position:absolute;border-radius:3px}
.thcard b{font-size:12.5px}
.thcard .pnote{margin:1px 0 0}
button.icon{padding:6px 8px;line-height:0}
.spkbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;padding:10px 12px;background:var(--panel2);border-radius:10px}
.spkchip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 8px}
.spkchip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.spkchip input{border:0;padding:2px 2px;background:transparent;font-weight:600;min-width:60px}
.spkchip small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty h1{color:var(--ink);font-size:22px;margin-bottom:6px}
.check{display:flex;align-items:center;gap:6px;font-size:13px}
.spacer{flex:1}
.hw td{padding:3px 12px 3px 0;font-size:13px}
.hw td:first-child{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="openAbout()" style="cursor:pointer" title="About sMeetSec">
    <svg width="34" height="34" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#222831"/><rect x="9" y="11" width="40" height="29" rx="7" fill="#f2f2f2"/><path d="M17 39 L12 51 L29 39 Z" fill="#f2f2f2"/><rect x="15" y="18" width="24" height="3.2" rx="1.6" fill="#8a93a6"/><rect x="15" y="24.4" width="17" height="3.2" rx="1.6" fill="#8a93a6"/><rect x="15" y="30.8" width="21" height="3.2" rx="1.6" fill="#8a93a6"/><circle cx="47" cy="12" r="5.5" fill="#ff6b6b" stroke="#222831" stroke-width="2"/><circle cx="50" cy="50" r="11" fill="#4dabf7"/><text x="50" y="55" font-size="15" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#fff">s</text></svg>
    <div><b>sMeetSec</b><small>simply handle IT · Meeting Secretary · offline</small></div>
  </div>
  <div class="chips">
    <div class="chip" id="chipCpu" title="Total CPU usage (3 s average). Red line = CPU guard limit."><span>CPU</span><div class="cpubar"><i id="cpuFill"></i><div class="lim" id="cpuLim"></div></div><span id="cpuVal">-</span></div>
    <div class="chip" id="chipHw"><span class="dot"></span><span>Hardware…</span></div>
    <div class="chip" id="chipLlm"><span class="dot"></span><span>LLM…</span></div>
    <button class="icon" id="bTheme" title="Theme" onclick="openTheme()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.9 2-2 0-.6-.2-1-.5-1.4-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3A4.7 4.7 0 0 0 21 9.7C21 5.9 17 3 12 3z"/><circle cx="7.5" cy="11.5" r="1.2"/><circle cx="10.5" cy="7.5" r="1.2"/><circle cx="15.5" cy="7.5" r="1.2"/></svg></button>

  </div>
</header>

<div class="wrap">
  <aside>
    <div class="new">
      <button class="primary" onclick="showUpload()">＋ Upload recording</button>
      <button id="btnLive" onclick="showLive()">● Live meeting</button>
    </div>
    <div class="list" id="mlist"></div>

<script>
const $ = s => document.querySelector(s);
const LANG = {ja:'Japanese', en:'English', th:'Thai', zh:'Chinese'};
const LANGS = ['en','th','ja','zh'];
const SPK_OPTS = (sel, withOff=true) => [[0,'Auto-detect speakers'], ...(withOff?[[-1,'Off (no speaker labels)']]:[]), ...[2,3,4,5,6,7,8].map(n=>[n, n+' speakers'])].map(([v,l]) => `<option value="${v}" ${v===sel?'selected':''}>${l}</option>`).join('');
const LANG_OPTS = `<option value="auto">Auto-detect</option><option value="mixed">Mixed languages</option><option value="ja">Japanese</option><option value="en">English</option><option value="th">Thai</option><option value="zh">Chinese (Mandarin)</option>`;
let SYS = null, MEETINGS = [], CUR = null, CUR_DATA = null, view = 'empty', tab = 'transcript', subLang = null, pollT = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = sec => { sec = Math.max(0, sec||0); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = Math.floor(sec%60); return (h? h+':'+String(m).padStart(2,'0') : String(m).padStart(2,'0'))+':'+String(s).padStart(2,'0'); };
const api = async (url, opt={}) => { const r = await fetch(url, opt); if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m } catch(e){} throw new Error(m) } return r.json(); };
const post = (url, body, method='POST') => api(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})});
const STATUS = {new:['New',''], transcribing:['Transcribing','run'], transcribed:['Transcribed',''], live:['Live','live'], reporting:['Reporting','run'], done:['Report ready','done'], error:['Error','err']};

// ------------------------------------------------------------- system
async function loadSystem(){
  SYS = await api('/api/system');
  const t = SYS.hardware.tier, e = SYS.effective;
  $('#chipHw').innerHTML = `<span class="dot ${t.device==='cuda'?'ok':'warn'}"></span><span>${esc(t.label)}</span>`;
  $('#chipHw').title = `${SYS.hardware.cpu}\nRAM ${SYS.hardware.ram_gb} GB\nBatch model: ${e.batch_model}\nLive model: ${e.live_model}\nThreads: ${e.cpu_threads}`;
  const l = SYS.llm;
  const llmName = l.engine === 'builtin' ? (l.selected||'').replace(/\.gguf$/i,'').replace(/^Qwen_/,'') : l.selected;
  $('#chipLlm').innerHTML = `<span class="dot ${l.running && l.installed ? 'ok' : l.running ? 'warn' : 'bad'}"></span><span>${l.running ? (l.installed ? 'LLM ' + esc(llmName) : 'LLM model missing') : (l.engine==='ollama' ? 'Ollama offline' : 'LLM engine missing')}</span>`;
  $('#chipLlm').title = l.engine === 'builtin' ? (l.installed ? 'Built-in translation engine (llama.cpp)' : 'Open Models and download the translation model') : (l.running ? (l.installed ? 'Ollama is running' : `Run: ollama pull ${l.selected}`) : 'Ollama is not running');
  $('#chipLlm').style.cursor = 'pointer'; $('#chipLlm').onclick = openModels;
  $('#bModels').innerHTML = SYS.models_ready ? '📦 Models' : '📦 Models <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:4px"></span>';
  $('#btnLive').title = e.live_allowed ? '' : 'Live mode needs an NVIDIA GPU (or experimental mode in Settings)';
}
async function pollGuard(){
  try {
    const g = await api('/api/guard');
    $('#cpuFill').style.width = Math.min(100, g.cpu) + '%';
    $('#cpuFill').style.background = g.cpu > g.limit ? 'var(--bad)' : g.cpu > g.limit - 15 ? 'var(--warn)' : 'var(--ok)';
    $('#cpuLim').style.left = g.limit + '%';
    $('#cpuVal').textContent = Math.round(g.cpu) + '%' + (g.state === 'throttling' ? ' ⏸' : '');
  } catch(e){}
}

function doUpload(){
  const f = $('#file').files[0]; if (!f) return;
  const fd = new FormData();
  fd.append('file', f); fd.append('title', $('#upTitle').value); fd.append('language', $('#upLang').value); fd.append('auto_report', $('#upAuto').checked); fd.append('speakers', $('#upSpk').value);
  $('#upBtn').disabled = true;
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  xhr.upload.onprogress = e => { if (e.lengthComputable) $('#upProg').innerHTML = jobHtml({title:'Uploading', message: Math.round(e.loaded/e.total*100)+'%', progress: e.loaded/e.total, status:'running'}) };
  xhr.onload = () => { if (xhr.status === 200) { const r = JSON.parse(xhr.responseText); openMeeting(r.meeting.id) } else { $('#upProg').innerHTML = `<div class="note err">${esc(xhr.responseText)}</div>`; $('#upBtn').disabled = false } };
  xhr.onerror = () => { $('#upProg').innerHTML = `<div class="note err">Upload failed</div>`; $('#upBtn').disabled = false };
  xhr.send(fd);
}

function jobHtml(j){
  const cancel = j.id && ['queued','waiting','running'].includes(j.status) ? `<a href="#" onclick="cancelJob('${j.id}');return false" style="color:var(--bad)">Cancel</a>` : '';
  return `<div class="job"><div class="lbl"><span><b>${esc(j.title)}</b> · ${esc(j.message)}</span><span>${Math.round((j.progress||0)*100)}% ${cancel}</span></div><div class="bar"><i style="width:${(j.progress||0)*100}%"></i></div></div>`;
}

let LV = null;
function showLive(){
  if (LV) { view = 'live'; return renderLive() }
  view = 'live'; CUR = null; loadMeetings();

  const warn = !e.live_allowed
    ? `<div class="note err"><b>Live mode is not available on this PC</b> (no NVIDIA GPU). Transcribing in real time would keep the CPU near 100%.<br>Record the meeting and use <b>Upload recording</b>, or enable <i>experimental live mode</i> in Settings.</div>`
    : e.live_experimental ? `<div class="note">Experimental live mode on CPU (model <b>${esc(e.live_model)}</b>). Expect high CPU use and lower accuracy, especially for Thai. The recording is saved, so you can run a full-quality pass afterwards.</div>`
    : `<div class="note info">Live model: <b>${esc(e.live_model)}</b> on GPU. The recording is saved so you can run a full-quality pass afterwards.</div>`;
  $('#main').innerHTML = `<div class="card"><h2>Live meeting</h2>${warn}
 <p class="muted" style="margin:0 0 10px">Tell participants the meeting is recorded and transcribed.</p>
    <div class="grid3"><label class="f">Meeting title<input id="lvTitle" placeholder="e.g. Supplier call"></label>
    <label class="f">Spoken language<select id="lvLang">${LANG_OPTS}</select></label>
    <label class="f">Audio source<select id="lvSrc"><option value="mic">Microphone (meeting room)</option><option value="sys">System audio (Teams / Zoom on this PC)</option><option value="both">Microphone + system audio</option></select></label></div>
    <div class="row" style="margin-top:14px"><button class="primary" id="lvStart" onclick="startLive()" ${e.live_allowed?'':'disabled'}>● Start</button>
    ${IN_DESKTOP() ? `<span class="spacer"></span><span class="muted">System audio capture works best in a browser:</span><button onclick="smeetsecOpenBrowser()">Open in browser ↗</button>` : ''}</div></div>`;
}

function renderLive(){
  $('#main').innerHTML = `<div class="card"><div class="row"><span class="rec"></span><b style="font-size:16px">${esc(LV.title||'Live meeting')}</b><span class="muted" id="lvTime">00:00</span>
    <span class="spacer"></span><span class="muted">Level</span><div class="meter"><i id="lvLevel"></i></div><button class="danger" onclick="stopLive()" id="lvStop">■ Stop</button></div>
    <div class="muted" id="lvStatus" style="margin:10px 0">${esc(LV.status||'Starting…')}</div>
    <div class="live-box" id="lvBox">${LV.segs.map(segHtml).join('')}<div class="partial" id="lvPartial">${esc(LV.partial||'')}</div></div></div>`;
}
const segHtml = s => `<div class="seg"><span>${fmt(s.start)}</span>${esc(s.text)}</div>`;

async function startLive(){
  const src = $('#lvSrc').value, lang = $('#lvLang').value;
  LV = {title: $('#lvTitle').value, segs: [], partial: '', status: 'Starting…', streams: [], ws: null, ctx: null};
  try {
    const streams = [];
    if (src === 'mic' || src === 'both') streams.push(await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1}}));
    if (src === 'sys' || src === 'both') {
      const ds = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
      if (!ds.getAudioTracks().length) { ds.getTracks().forEach(t=>t.stop()); throw new Error('No system audio was shared. In the share dialog, tick "Share system audio" (or "Share tab audio").'); }
      streams.push(ds);
    }
    LV.streams = streams;
    const ctx = new AudioContext({sampleRate: 16000});
    LV.ctx = ctx;
    const code = `class P extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(1600);this.n=0}
      process(inp){const c=inp[0];if(!c||!c.length)return true;const L=c[0].length;for(let i=0;i<L;i++){let v=0;for(let k=0;k<c.length;k++)v+=c[k][i];this.b[this.n++]=v/c.length;if(this.n===1600){this.port.postMessage(this.b.slice());this.n=0}}return true}}
      registerProcessor('cap',P)`;
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], {type:'application/javascript'})));
    const node = new AudioWorkletNode(ctx, 'cap', {channelCount:1, channelCountMode:'explicit'});
    streams.forEach(s => ctx.createMediaStreamSource(new MediaStream(s.getAudioTracks())).connect(node));
    const ratio = ctx.sampleRate / 16000;
    const ws = new WebSocket(`ws://${location.host}/ws/live`);
    ws.binaryType = 'arraybuffer';
    LV.ws = ws;
    ws.onopen = () => ws.send(JSON.stringify({title: LV.title, language: lang}));
    ws.onmessage = ev => onLiveMsg(JSON.parse(ev.data));
    ws.onclose = () => { if (LV && !LV.stopped) { LV.status = 'Connection closed'; cleanupLive(); } };
    node.port.onmessage = ev => {
      let x = ev.data;
      if (ratio !== 1) { const n = Math.floor(x.length/ratio), y = new Float32Array(n); for (let i=0;i<n;i++) y[i] = x[Math.floor(i*ratio)]; x = y; }
      let peak = 0; const pcm = new Int16Array(x.length);
      for (let i=0;i<x.length;i++){ const v = Math.max(-1, Math.min(1, x[i])); pcm[i] = v*32767; peak = Math.max(peak, Math.abs(v)); }
      const lv = document.getElementById('lvLevel'); if (lv) lv.style.width = Math.min(100, peak*140) + '%';
      if (ws.readyState === 1 && LV.started) ws.send(pcm.buffer);
    };
    streams.forEach(s => s.getTracks().forEach(t => t.onended = () => stopLive()));
    renderLive();
  } catch(e) {
    cleanupLive(); LV = null; showLive();
    $('#main').insertAdjacentHTML('afterbegin', `<div class="note err">${esc(e.message || e)}</div>`);
  }
}

function onLiveMsg(m){
  if (!LV) return;
  if (m.type === 'started') { LV.started = true; LV.mid = m.meeting_id; loadMeetings(); }
  else if (m.type === 'status') LV.status = m.msg;
  else if (m.type === 'error') { LV.status = m.msg; alert(m.msg); }
  else if (m.type === 'partial') LV.partial = m.text;
  else if (m.type === 'commit') { LV.segs.push(m.segment); LV.partial = ''; if (view==='live') { $('#lvPartial').insertAdjacentHTML('beforebegin', segHtml(m.segment)); } }
  else if (m.type === 'cpu') { LV.sec = m.seconds; }
  else if (m.type === 'stopped') { const id = m.meeting.id; LV.stopped = true; cleanupLive(); LV = null; openMeeting(id); return; }
  if (view === 'live') {
    const p = $('#lvPartial'); if (p) p.textContent = LV.partial || '';
    const s = $('#lvStatus'); if (s) s.textContent = LV.status;
    const t = $('#lvTime'); if (t) t.textContent = fmt(LV.sec||0);
    const b = $('#lvBox'); if (b && m.type !== 'cpu') b.scrollTop = b.scrollHeight;
  }
}
function stopLive(){
  if (!LV || LV.stopping) return; LV.stopping = true; LV.status = 'Stopping - finishing the last sentence…';
  const b = $('#lvStop'); if (b) b.disabled = true; const s = $('#lvStatus'); if (s) s.textContent = LV.status;
  LV.streams.forEach(s => s.getTracks().forEach(t => { t.onended = null; t.stop() }));
  try { LV.ctx && LV.ctx.close() } catch(e){}
  if (LV.ws && LV.ws.readyState === 1) LV.ws.send(JSON.stringify({cmd:'stop'})); else { cleanupLive(); LV = null; showEmpty(); }
}
function cleanupLive(){ if (!LV) return; LV.streams.forEach(s => s.getTracks().forEach(t => { t.onended = null; t.stop() })); try { LV.ctx && LV.ctx.state !== 'closed' && LV.ctx.close() } catch(e){} try { LV.ws && LV.ws.readyState < 2 && LV.stopped && LV.ws.close() } catch(e){} }
window.addEventListener('beforeunload', e => { if (LV && !LV.stopped) { e.preventDefault(); e.returnValue = ''; } });
// Desktop window (sMeetSec.exe): ask before closing while a live meeting or a job is running.
window.__smeetsecRequestClose = async () => {
  try { window.smeetsecCloseAck && smeetsecCloseAck(); } catch(e){}
  let running = [];
  try { running = (await api('/api/jobs')).filter(j => ['queued','waiting','running'].includes(j.status)); } catch(e){}
  const liveOn = LV && !LV.stopped;
  if (liveOn || running.length) {
    const what = liveOn ? 'A live meeting is being recorded.' : `${running.length} job(s) are still running (${running.map(j=>j.title).join(', ')}).`;
    if (!confirm(what + '\n\nClose sMeetSec anyway? ' + (liveOn ? 'The recording so far is kept.' : 'Running jobs will stop.'))) return;
    if (liveOn) { stopLive(); for (let i=0;i<40 && LV;i++) await new Promise(r=>setTimeout(r,250)); }
  }
  window.smeetsecQuit && smeetsecQuit();
};
const IN_DESKTOP = () => typeof window.smeetsecQuit === 'function';

async function saveSettings(){
  await post('/api/settings', {
    cpu_limit_percent: +$('#sLim').value, cpu_limit_action: $('#sAct').value, cpu_thread_fraction: +$('#sFr').value, low_priority: $('#sPri').checked,

let modelsTimer = null;
async function openModels(){
  $('#modelsM').classList.add('on');

async function renderModels(){
  const r = await api('/api/models');
  const job = r.jobs[0];
  const missing = r.items.filter(i => !i.present && !(i.id==='llm' && i.engine==='ollama'));
  const wasRunning = renderModels.running; renderModels.running = !!job;
  if (wasRunning && !job) loadSystem();
  $('#modelsBox').innerHTML = `<div class="row"><h2 style="margin:0">Models</h2><span class="spacer"></span><button onclick="$('#modelsM').classList.remove('on')">✕</button></div>
  <p class="muted">sMeetSec needs three AI models. They are downloaded once (internet needed only for this) into the <b>models</b> folder next to sMeetSec.exe. For a PC without internet, copy the models folder from another PC.</p>
  <table class="tr">${r.items.map(i => `<tr><td style="width:28px;font-size:18px">${i.present ? '✅' : '⬜'}</td><td><b>${esc(i.label)}</b>${i.id==='llm'&&i.engine==='ollama'?' <span class="muted">(using Ollama)</span>':''}</td><td class="muted" style="width:120px">${esc(i.size)}</td><td style="width:120px">${i.present ? '<span class="badge done">installed</span>' : '<span class="badge err">missing</span>'}</td></tr>`).join('')}</table>
  ${job ? jobHtml(job) : (r.last && ['error','stopped'].includes(r.last.status) ? `<div class="note err" style="margin-top:12px">${esc(r.last.error || r.last.message)}</div>` : '')}

    ${IN_DESKTOP() ? '<button onclick="smeetsecOpenModels()">Open models folder</button>' : ''}
    <button class="primary" onclick="downloadModels()" ${job || !missing.length ? 'disabled' : ''}>${missing.length ? '⬇ Download missing models' : 'All models installed'}</button></div>`;
}
async function downloadModels(){ await post('/api/models/download', {}); renderModels(); }
$('#modelsM').onclick = e => { if (e.target.id === 'modelsM') $('#modelsM').classList.remove('on') };

  forest:{name:'Forest',note:'greens, parchment',panel:'#f8f5ec',head:'#efeadc',stage:'#e3ebdc',line:'rgba(47,90,54,.25)',a:'#2f6b3a',b:'#5c8f3c'},

document.addEventListener('pointerdown', e => { const p = $('#themePop'); if (!p.hidden && !p.contains(e.target) && !e.target.closest('#bTheme')) p.hidden = true; });

// ------------------------------------------------------------- start
(async () => {
  await loadSystem(); if (!SYS.models_ready && !SYS.app.mock) openModels(); if (SYS.settings.theme && SYS.settings.theme !== themeName) { themeName = SYS.settings.theme; applyTheme(); } showEmpty(); pollGuard();
  setInterval(pollGuard, 2000);
  setInterval(() => { if (view === 'meeting') refreshMeeting(); }, 1500);
  setInterval(() => { if (view !== 'live') loadMeetings(); }, 8000);
  setInterval(loadSystem, 30000);
